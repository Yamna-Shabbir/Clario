# Render Blueprint — FREE tier only.
# No paid compute plan. No persistent disk. No billing required for this file.
#
# Render looks for this file by default when you create a Blueprint.
# The paid setup is preserved separately in render.standard.yaml — do not
# apply that file unless you accept charges.
#
# Realistic free-tier behavior (512 MB RAM, ephemeral disk):
#   Works: landing, auth, dashboard, paste-transcript meetings, extractive
#          summary, spaCy task extraction, charts (until spin-down), /health
#   Does not work: Whisper/Sukhan audio ASR, DistilBART neural summary,
#                  Marian translation, durable SQLite across restarts
# All of those features remain in the codebase; they need a paid instance
# (see render.standard.yaml) to run online.

services:
  - type: web
    name: clario
    runtime: python
    plan: free
    region: oregon
    branch: dev
    buildCommand: bash build.sh
    startCommand: >-
      gunicorn "app:create_app()"
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 2
      --timeout 120
      --access-logfile -
      --error-logfile -
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin Python via env (Blueprint has no pythonVersion field). runtime.txt is a backup.
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CLARIO_DEBUG
        value: "False"
      - key: CLARIO_SECRET_KEY
        generateValue: true
      - key: CLARIO_FREE_TIER
        value: "True"
      - key: CLARIO_DATA_DIR
        value: data
      - key: CLARIO_DB_PATH
        value: data/database/clario.db
      - key: CLARIO_UPLOAD_DIR
        value: uploads
      - key: CLARIO_HF_MODELS_DIR
        value: data/hf-models
      - key: CLARIO_GRAPH_DIR
        value: data/graphs
      - key: CLARIO_STATIC_GRAPH_DIR
        value: static/graphs
      - key: CLARIO_EMAIL_DIR
        value: data/outbox
      # Free Render blocks SMTP ports 587 and 465. Paste a Brevo API key here
      # (Dashboard → Environment) after verifying the sender address in Brevo.
      - key: CLARIO_BREVO_API_KEY
        sync: false
      - key: CLARIO_SMTP_FROM
        sync: false
      - key: CLARIO_PIPELINE_WORKERS
        value: "1"
      - key: CLARIO_MAX_UPLOAD_MB
        value: "25"
      - key: CLARIO_ENABLE_TEXT_TRANSLATION
        value: "False"
      - key: HF_HUB_DISABLE_XET
        value: "1"
