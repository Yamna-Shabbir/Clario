name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-core.txt

      # Install only core deps (no torch / transformers / openai-whisper)
      - name: Install core dependencies
        run: pip install -r requirements-core.txt

      # spaCy model download (required for real task-detection tests)
      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      # Run the full test suite with branch coverage
      - name: Run pytest
        env:
          CLARIO_DEBUG: "True"
          CLARIO_SECRET_KEY: "ci-test-secret-key-not-for-production"
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            -v \
            --tb=short

