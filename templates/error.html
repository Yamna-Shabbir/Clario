{% extends "base.html" %}
{% from "macros/icons.html" import icon_arrow_left %}

{% block title %}{{ code }} – {{ title }}{% endblock %}

{% block content %}
<div class="error-shell">
  <div>
    <div class="error-code">{{ code }}</div>
    <h1 class="error-title">{{ title }}</h1>
    <p class="text-muted stack-lg">{{ message }}</p>
    <a href="{{ url_for('auth.landing') }}" class="btn btn-primary">{{ icon_arrow_left(16, 'icon') }} Go home</a>
  </div>
</div>
{% endblock %}
